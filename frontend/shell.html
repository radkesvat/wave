<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#@WAVE_STARTUP_CANVAS@">
    <title>Wave</title>
    <link rel="icon" href="data:,">
    <style>
      :root {
        color-scheme: dark;
        background: #@WAVE_STARTUP_CANVAS@;
        color: #@WAVE_STARTUP_TEXT@;
        font: 1rem/1.5 system-ui, sans-serif;
      }

      :root.server-status { scrollbar-gutter: stable; }

      @media not (forced-colors: active) {
        :root.classic-scrollbars::-webkit-scrollbar,
        :root.classic-scrollbars::-webkit-scrollbar-track { background-color: var(--scrollbar-track); }
        :root.classic-scrollbars::-webkit-scrollbar-thumb {
          background: var(--scrollbar-thumb) padding-box;
          border: 2px solid transparent;
          border-radius: 9px;
        }
        :root.classic-scrollbars::-webkit-scrollbar-thumb:hover { background-color: var(--scrollbar-hover); }
        :root.classic-scrollbars::-webkit-scrollbar-thumb:active { background-color: var(--scrollbar-active); }
      }

      body { margin: 0; }

      main { position: relative; }

      #scrollbar-probe {
        position: fixed;
        top: 0;
        left: -100px;
        width: 100px;
        height: 100px;
        overflow-y: scroll;
        visibility: hidden;
      }

      #canvas {
        display: block;
        visibility: hidden;
        width: 100%;
        height: max(100vh, var(--panel-height, 0px));
        height: max(100dvh, var(--panel-height, 0px));
        outline: none;
        touch-action: pinch-zoom;
      }

      #canvas[data-ready] { visibility: visible; }

      .panel-controls {
        position: absolute;
        top: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      #wave-text-input {
        position: fixed;
        opacity: 0.001;
        width: 1px;
        height: 1px;
        padding: 0;
        border: 0;
        font-size: 16px;
        pointer-events: none;
      }

      #wave-console {
        --terminal-border: #3d3a43;
        --terminal-text: #b5b4c5;
        --terminal-focus: #f3814a;
        position: absolute;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--terminal-border);
        border-radius: 8px;
        background: #050506;
      }

      #wave-console[data-high-contrast] {
        --terminal-border: #b5b0c4;
        --terminal-text: #eaebff;
        --terminal-focus: #ffb48f;
      }

      #wave-console-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border-bottom: 1px solid var(--terminal-border);
        background: #1a171c;
        font-size: .875rem;
      }

      #wave-console-toolbar button {
        min-height: 32px;
        padding: 3px 10px;
        border: 1px solid #8a8495;
        border-radius: 5px;
        background: #45404f;
        color: #eaebff;
        font: inherit;
      }

      #wave-console-toolbar button:hover:not(:disabled) { background: #595067; }
      #wave-console-toolbar button[aria-pressed="true"] { background: #754430; }
      #wave-console-toolbar button:focus-visible { outline: 2px solid var(--terminal-focus); }

      #wave-console-status {
        min-width: 0;
        margin-inline: 4px;
        color: var(--terminal-text);
        overflow-wrap: anywhere;
      }

      #wave-console-terminal {
        flex: 1;
        min-height: 0;
        margin: 7px 8px;
        overflow: hidden;
      }

      .startup-message {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
      }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="scrollbar-probe" aria-hidden="true"></div>
    <div id="panel-controls" class="panel-controls" hidden>
      <button id="menu" type="button" aria-expanded="false">Menu</button>
      <button id="tools" type="button" aria-expanded="false">Tools</button>
      <nav id="navigation" aria-label="Wave"></nav>
      <div id="config-tabs" role="tablist" aria-label="Config tabs" hidden></div>
    </div>
    <main>
      <div id="startup" class="startup-message" role="status" hidden>Loading Wave…</div>
      <noscript><div class="startup-message">Wave requires JavaScript and WebGL 2.</div></noscript>
      <canvas id="canvas" role="img" aria-label="Wave" tabindex="0"></canvas>
      <textarea id="wave-text-input" aria-label="Wave text input" tabindex="-1" autocomplete="off"
                autocapitalize="off" spellcheck="false" rows="1" hidden></textarea>
      <section id="wave-console" aria-label="WaterWall terminal" hidden>
        <div id="wave-console-toolbar">
          <button id="wave-console-toggle" type="button" disabled>Open terminal</button>
          <button id="wave-console-ctrl" type="button" aria-pressed="false" title="Press Ctrl, then a key" hidden>Ctrl</button>
          <button id="wave-console-esc" type="button" hidden>Esc</button>
          <label><input id="wave-console-screen-reader" type="checkbox"> Screen reader output</label>
          <span id="wave-console-status" role="status">Shell runs as the Wave service account.</span>
        </div>
        <div id="wave-console-terminal"></div>
      </section>
    </main>
    <script>
      var Module = (() => {
        const canvas = document.getElementById("canvas");
        const startup = document.getElementById("startup");
        const controls = document.getElementById("panel-controls");
        const menu = document.getElementById("menu");
        const tools = document.getElementById("tools");
        const navigation = document.getElementById("navigation");
        const configTabs = document.getElementById("config-tabs");
        const textInput = document.getElementById("wave-text-input");
        const terminalPanel = document.getElementById("wave-console");
        const pageLinks = new Map();
        const headerControlIds = new Map();
        let activePage;
        let configTabNames;
        let touch = null;
        let writingClipboard = false;
        let consoleActive = false;
        let consolePosition = "";
        let consoleLoading;
        let consoleView;
        startup.hidden = false;

        if (CSS.supports("selector(::-webkit-scrollbar-thumb)")) {
          // Styling an overlay scrollbar can give the page a new gutter. Measure a native scrollbar.
          const probe = document.getElementById("scrollbar-probe");
          const updateScrollbarMode = () => {
            document.documentElement.classList.toggle("classic-scrollbars", probe.clientWidth < probe.offsetWidth);
          };
          updateScrollbarMode();
          new ResizeObserver(updateScrollbarMode).observe(probe);
        }

        function registerControl(element, id, focusCanvas) {
          element.addEventListener("click", event => {
            event.preventDefault();
            if (focusCanvas) canvas.focus({ preventScroll: true });
            Module['_wave_activate_panel_control'](id);
          });
        }

        function registerHeaderControls(menuId, toolsId) {
          headerControlIds.set(menu, menuId);
          headerControlIds.set(tools, toolsId);
          registerControl(menu, menuId, true);
          registerControl(tools, toolsId, true);
        }

        function registerPanelPage(id, label, before = null) {
          const link = document.createElement("a");
          link.href = "#canvas";
          link.tabIndex = -1;
          link.textContent = label;
          registerControl(link, id, false);
          pageLinks.set(id, link);
          navigation.insertBefore(link, before);
          return link;
        }

        function updateConfigLinks(configs, footer) {
          const ids = new Set(configs.map(config => config.id));
          for (const [id, link] of pageLinks) {
            if (id < 0 && !ids.has(id)) {
              link.remove();
              pageLinks.delete(id);
            }
          }
          const before = pageLinks.get(footer);
          for (const { id, name } of configs) {
            const link = pageLinks.get(id) || registerPanelPage(id, name, before);
            if (link.textContent !== name) {
              link.textContent = name;
              if (id === activePage) document.title = name + " · Wave";
            }
          }
        }

        function updateConfigTabs(encoded, selected) {
          configTabs.hidden = selected < 0;
          if (selected < 0) return;
          if (encoded !== configTabNames) {
            configTabNames = encoded;
            configTabs.replaceChildren(...JSON.parse(encoded).map((name, index) => {
              const tab = document.createElement("button");
              tab.type = "button";
              tab.setAttribute("role", "tab");
              tab.textContent = name;
              tab.addEventListener("click", () => Module['_wave_activate_config_tab'](index));
              return tab;
            }));
          }
          for (let index = 0; index < configTabs.children.length; ++index) {
            const tab = configTabs.children[index];
            tab.tabIndex = index === selected ? 0 : -1;
            tab.setAttribute("aria-selected", String(index === selected));
          }
        }

        configTabs.addEventListener("keydown", event => {
          const tabs = Array.from(configTabs.children);
          const index = tabs.indexOf(event.target);
          if (index < 0) return;
          let next;
          if (event.key === "ArrowLeft") next = (index + tabs.length - 1) % tabs.length;
          else if (event.key === "ArrowRight") next = (index + 1) % tabs.length;
          else if (event.key === "Home") next = 0;
          else if (event.key === "End") next = tabs.length - 1;
          else return;
          event.preventDefault();
          tabs[next].focus({ preventScroll: true });
          tabs[next].click();
        });

        function scrollPanel(event, dx, dy) {
          const bounds = canvas.getBoundingClientRect();
          Module['_wave_scroll_panel'](event.clientX - bounds.left, event.clientY - bounds.top, dx, dy);
        }

        function usesDocumentScroll(event, bounds = canvas.getBoundingClientRect()) {
          return bounds.height > innerHeight && event.clientX < bounds.right - 34 &&
              !Module['_wave_scroll_window_at'](event.clientX - bounds.left, event.clientY - bounds.top);
        }

        canvas.addEventListener("wheel", event => {
          if (event.ctrlKey) return;
          const step = event.deltaMode === 1 ? 3 : event.deltaMode === 2 ? 1 : 75;
          if (!event.shiftKey && Math.abs(event.deltaY) >= Math.abs(event.deltaX)) {
            const bounds = canvas.getBoundingClientRect();
            if (event.deltaY && Module['_wave_zoom_node_graph'](event.clientX - bounds.left,
                event.clientY - bounds.top, -event.deltaY / step)) {
              event.preventDefault();
              return;
            }
            if (usesDocumentScroll(event, bounds)) return;
          }
          const horizontal = event.shiftKey && event.deltaX === 0;
          scrollPanel(event, -(horizontal ? event.deltaY : event.deltaX) / step,
                      horizontal ? 0 : -event.deltaY / step);
          event.preventDefault();
        }, { passive: false });

        canvas.addEventListener("pointerdown", event => {
          if (event.pointerType !== "touch") {
            if (document.activeElement !== textInput) canvas.focus({ preventScroll: true });
            return;
          }
          event.preventDefault();
          if (!event.isPrimary) {
            touch = null;
            return;
          }
          const bounds = canvas.getBoundingClientRect();
          touch = {
            id: event.pointerId, x: event.clientX, y: event.clientY,
            lastX: event.clientX, lastY: event.clientY, panning: false,
            topology: Module['_wave_topology_at'](event.clientX - bounds.left, event.clientY - bounds.top),
            pageScroll: usesDocumentScroll(event, bounds)
          };
        });
        canvas.addEventListener("pointermove", event => {
          if (touch?.id !== event.pointerId) return;
          touch.panning ||= Math.hypot(event.clientX - touch.x, event.clientY - touch.y) > 8;
          if (!touch.panning) return;
          const dx = touch.lastX - event.clientX;
          const dy = touch.lastY - event.clientY;
          if (touch.topology) {
            Module['_wave_pan_topology'](-dx, -dy);
          } else if (touch.pageScroll && Math.abs(event.clientY - touch.y) >= Math.abs(event.clientX - touch.x)) {
            window.scrollBy(0, dy);
          } else {
            scrollPanel(event, -dx / 36, -dy / 36);
          }
          touch.lastX = event.clientX;
          touch.lastY = event.clientY;
        });
        function cancelTouch(event) {
          if (touch?.id === event.pointerId) touch = null;
        }
        canvas.addEventListener("pointercancel", cancelTouch);
        canvas.addEventListener("lostpointercapture", cancelTouch);
        canvas.addEventListener("pointerup", event => {
          if (touch?.id !== event.pointerId) return;
          const tapped = !touch.panning;
          touch = null;
          if (!tapped) return;
          const bounds = canvas.getBoundingClientRect();
          Module['_wave_tap_panel'](event.clientX - bounds.left, event.clientY - bounds.top);
        });

        function setTextInput(active, x, y) {
          if (!active) {
            if (document.activeElement === textInput) canvas.focus({ preventScroll: true });
            textInput.hidden = true;
            textInput.value = "";
            return;
          }
          const bounds = canvas.getBoundingClientRect();
          textInput.style.left = Math.max(0, Math.min(innerWidth - 2, bounds.left + x)) + "px";
          textInput.style.top = Math.max(0, Math.min(innerHeight - 2, bounds.top + y)) + "px";
          textInput.hidden = false;
          if (document.activeElement !== textInput) textInput.focus({ preventScroll: true });
        }

        function installTextInput(send) {
          function forwardKey(event) {
            if (event.isComposing || ((event.ctrlKey || event.metaKey) && event.code === "KeyV")) return;
            const forwarded = new KeyboardEvent(event.type, event);
            if (!canvas.dispatchEvent(forwarded)) event.preventDefault();
          }

          textInput.addEventListener("keydown", forwardKey);
          textInput.addEventListener("keyup", forwardKey);
          textInput.addEventListener("input", event => {
            if (event.isComposing) return;
            if (textInput.value) send(textInput.value);
            textInput.value = "";
          });
          textInput.addEventListener("paste", event => {
            const text = event.clipboardData?.getData("text/plain");
            if (text === undefined) return;
            event.preventDefault();
            if (text) send(text, true);
          });
        }

        function copyText(text) {
          function copyEvent(event) {
            event.clipboardData.setData("text/plain", text);
            event.preventDefault();
          }
          function copyOnHttp() {
            if (writingClipboard) return;
            writingClipboard = true;
            document.addEventListener("copy", copyEvent);
            try { document.execCommand("copy"); }
            finally {
              document.removeEventListener("copy", copyEvent);
              writingClipboard = false;
            }
          }
          if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).catch(copyOnHttp);
          else copyOnHttp();
        }

        function showStartupError() {
          if (canvas.hasAttribute("data-ready")) return;
          startup.textContent = "Wave could not start. Use the configured Wave URL and a browser with WebGL 2 enabled.";
        }

        function showPanel() {
          canvas.setAttribute("data-ready", "");
          controls.hidden = false;
          startup.hidden = true;
        }

        function updateDescription(description) {
          canvas.setAttribute("aria-label", description);
        }

        function updateNavigation(page, open, menuOpen, toolsOpen, modal, serverStatus) {
          document.documentElement.classList.toggle("server-status", serverStatus);
          const updateExpanded = (element, expanded) => {
            const value = expanded ? "true" : "false";
            if (element.getAttribute("aria-expanded") !== value) element.setAttribute("aria-expanded", value);
          };
          updateExpanded(menu, menuOpen);
          updateExpanded(tools, toolsOpen);
          if (controls.inert !== Boolean(modal)) {
            controls.inert = modal;
          }
          if (navigation.hidden === Boolean(open)) navigation.hidden = !open;
          if (page !== activePage) {
            pageLinks.get(activePage)?.removeAttribute("aria-current");
            const link = pageLinks.get(page);
            link?.setAttribute("aria-current", "page");
            document.title = link ? link.textContent + " · Wave" : "Wave";
            activePage = page;
          }
        }

        function panelFocus() {
          return headerControlIds.get(document.activeElement) ?? 0;
        }

        function updateConsole(active, x, y, width, height, highContrast) {
          const visible = Boolean(active && width > 0 && height > 0);
          if (terminalPanel.hidden === visible) terminalPanel.hidden = !visible;
          if (!active && consoleActive) consoleView?.disconnect();
          consoleActive = Boolean(active);
          if (!visible) return;

          const position = `${x},${y},${width},${height}`;
          if (position !== consolePosition) {
            Object.assign(terminalPanel.style, {
              left: `${x}px`, top: `${y}px`, width: `${width}px`, height: `${height}px`
            });
            consolePosition = position;
          }
          terminalPanel.toggleAttribute("data-high-contrast", highContrast);
          consoleView?.setHighContrast(highContrast);
          consoleLoading ??= import("./console.js").then(({ createConsole }) => {
            consoleView = createConsole(terminalPanel, copyText);
          }).catch(() => {
            document.getElementById("wave-console-status").textContent = "Console could not load. Reload Wave to retry.";
          });
        }

        window.addEventListener("error", showStartupError, true);
        window.addEventListener("unhandledrejection", showStartupError);
        return {
          canvas, showPanel, updateDescription, registerHeaderControls, registerPanelPage, updateNavigation,
          updateConfigLinks, updateConfigTabs,
          panelFocus, setTextInput, installTextInput, copyText, updateConsole, onAbort: showStartupError
        };
      })();
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
