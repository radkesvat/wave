name: Wave release packages

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  EMSDK_VERSION: '7.0.1'

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build WebAssembly site
        run: |
          sdk_dir="$RUNNER_TEMP/emsdk"
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$sdk_dir"
          "$sdk_dir/emsdk" install "$EMSDK_VERSION"
          "$sdk_dir/emsdk" activate "$EMSDK_VERSION"
          EMSDK_QUIET=1 source "$sdk_dir/emsdk_env.sh"
          cmake --preset web-release -DBUILD_TESTING=OFF
          cmake --build --preset web-release --parallel 2
          notices=build/web-release/site/licenses
          sdl_cache="$(em-config CACHE)/ports/sdl2"
          install -m 0644 "$sdk_dir/upstream/emscripten/LICENSE" "$notices/emscripten.txt"
          install -m 0644 "$sdk_dir/upstream/emscripten/system/lib/libc/musl/COPYRIGHT" "$notices/musl.txt"
          install -m 0644 "$sdl_cache"/*/LICENSE.txt "$notices/sdl2.txt"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-site
          path: build/web-release/site/
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-site
          path: build/web-release/site/
      - name: Build native backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends acl libssl-dev ninja-build zip
          cmake --preset backend-release -DBUILD_TESTING=OFF -DWAVE_ENABLE_AUTH=ON
          cmake --build --preset backend-release --parallel 2
      - name: Package and smoke test Wave
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          tag="v$(build/backend-release/wave-backend --version)"
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          assets="$RUNNER_TEMP/release-assets"
          source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$(git rev-parse HEAD).tar.gz"
          archive=$(bash release/package.sh "$tag" "$ARCH" build/backend-release build/web-release/site "$assets" "$source_url")
          install -m 0755 scripts/install.sh "$assets/install.sh"
          (cd "$assets" && sha256sum -- "${archive##*/}" install.sh > SHA256SUMS)
          bash release/smoke.sh "$assets" "$tag"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wave-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-assets/wave-v*-linux-${{ matrix.arch }}.zip
          compression-level: 0
          if-no-files-found: error

  bundle:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wave-linux-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets
      - name: Assemble release assets
        run: |
          assets="$RUNNER_TEMP/release-assets"
          install -m 0755 scripts/install.sh "$assets/install.sh"
          cd "$assets"
          sha256sum -- wave-v*-linux-x86_64.zip wave-v*-linux-aarch64.zip install.sh > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-assets/
          compression-level: 0
          if-no-files-found: error

  draft:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-assets
      - name: Stage draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/release-assets"
          sha256sum --check --strict SHA256SUMS
          tag="$GITHUB_REF_NAME"
          files=("wave-$tag-linux-x86_64.zip" "wave-$tag-linux-aarch64.zip" SHA256SUMS install.sh)
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [[ $draft != true ]]; then
              printf 'Release %s is already published.\n' "$tag"
              exit 0
            fi
            gh release upload "$tag" --clobber "${files[@]}"
          else
            flags=(--verify-tag --draft --generate-notes --title "Wave $tag")
            if [[ $tag == *-beta ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$tag" "${flags[@]}" "${files[@]}"
          fi
